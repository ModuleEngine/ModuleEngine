[package]
name = "module-engine-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
bench = ["module-engine-vulkan/bench"]
r31-spike = ["dep:ash", "dep:bytemuck", "dep:egui-ash-renderer", "dep:egui-winit", "dep:winit", "module-engine-vulkan/editor-spike"]

[dependencies]
module-engine-player = { path = "../player", features = ["ui", "arpg", "puzzle", "g1", "vulkan", "audio", "persistence"] }
module-engine-host = { path = "../game-host" }
module-engine-host-services = { path = "../host-services", features = ["audio", "persistence"] }
module-engine-core = { path = "../engine-core" }
module-engine-arpg = { path = "../gameplay-arpg", features = ["ui"] }
module-engine-two-arenas = { path = "../example-two-arenas" }
module-engine-project-puzzle = { path = "../project-puzzle", features = ["ui"] }
module-engine-g1 = { path = "../project-g1", features = ["ui"] }
module-engine-custom = { path = "../custom-rust" }
module-engine-vulkan = { path = "../render-vulkan" }
module-engine-script = { path = "../runtime-script" }
module-engine-project = { path = "../project-tools" }
module-engine-content = { path = "../engine-content" }
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true
png.workspace = true

[target.'cfg(windows)'.dependencies]
ash = { version = "0.38", optional = true }
bytemuck = { version = "1", optional = true }
egui-ash-renderer = { version = "=0.13.0", optional = true }
egui-winit = { version = "0.36.2", default-features = false, optional = true }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
libc = "0.2"


