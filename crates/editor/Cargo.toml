[package]
name = "module-engine-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["arpg", "puzzle", "g1"]
arpg = ["module-engine-editor-composition/arpg"]
puzzle = ["module-engine-editor-composition/puzzle"]
g1 = ["module-engine-editor-composition/g1"]
bench = ["module-engine-vulkan/bench"]
r31-spike = ["module-engine-native-ui/spike", "dep:egui-winit", "dep:winit"]
verification = ["module-engine-editor-composition/verification"]

[dependencies]
module-engine-native-ui = { path = "../native-ui" }
module-engine-game-ui = { path = "../game-ui" }
module-engine-editor-composition = { path = "../editor-composition", default-features = false }
module-engine-player = { path = "../player", features = ["ui", "vulkan", "audio", "persistence", "rapier-physics"] }
module-engine-host = { path = "../game-host" }
module-engine-host-services = { path = "../host-services", features = ["audio", "persistence"] }
module-engine-core = { path = "../engine-core" }
module-engine-physics-rapier = { path = "../physics-rapier", features = ["debug-draw"] }
module-engine-custom = { path = "../custom-rust" }
module-engine-vulkan = { path = "../render-vulkan" }
module-engine-script = { path = "../runtime-script" }
module-engine-project = { path = "../project-tools" }
module-engine-content = { path = "../engine-content", features = ["texture-bake"] }
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true
png.workspace = true

[target.'cfg(windows)'.dependencies]
egui-winit = { version = "0.36.2", default-features = false, optional = true }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
libc = "0.2"



[dev-dependencies]
# Integration fixtures exercise the complete reference composition.
module-engine-editor-composition = { path = "../editor-composition" }
