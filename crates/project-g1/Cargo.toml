[package]
name = "module-engine-g1"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
verification = ["dep:module-engine-host", "dep:module-engine-project"]
default = []
ui = ["dep:egui", "dep:module-engine-game-ui"]

[dependencies]
module-engine-host = { path = "../game-host", optional = true }
module-engine-project = { path = "../project-tools", optional = true }
module-engine-game-ui = { path = "../game-ui", optional = true }
module-engine-core = { path = "../engine-core" }
module-engine-game-kit = { path = "../game-kit", default-features = false, features = ["grid", "history", "campaign", "actions"] }
serde.workspace = true
serde_json.workspace = true
egui = { workspace = true, optional = true }
