[package]
name = "module-engine-vulkan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
bench = ["dep:meshopt", "dep:bytemuck"]
editor-spike = ["window-surface"]
window-surface = ["dep:ash-window", "dep:raw-window-handle"]

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
module-engine-core = { path = "../engine-core" }
thiserror.workspace = true
ash = "0.38"
ash-window = { version = "0.13", optional = true }
raw-window-handle = { version = "0.6", optional = true }
bytemuck = { version = "1", optional = true }
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
meshopt = { version = "0.6.2", optional = true }
serde.workspace = true
serde_json.workspace = true
png.workspace = true

[dev-dependencies]
module-engine-content = { path = "../engine-content" }
