[package]
name = "module-engine-native-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
spike = ["dep:bytemuck"]

[dependencies]
module-engine-core = { path = "../engine-core" }
module-engine-vulkan = { path = "../render-vulkan", features = ["window-surface"] }
ash = "0.38"
bytemuck = { version = "1", optional = true }
egui = { workspace = true, features = ["bytemuck"] }
egui-ash-renderer = { version = "=0.13.0", path = "../vendor/egui-ash-renderer" }
egui-winit = { version = "0.36.2", features = ["clipboard"], default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
serde.workspace = true
png.workspace = true
scoped-tls = "1"

[target.'cfg(target_os = "linux")'.dependencies]
egui-winit = { version = "0.36.2", default-features = false, features = ["wayland", "x11"] }
winit = { version = "0.30.13", default-features = false, features = ["wayland", "wayland-dlopen", "x11"] }
