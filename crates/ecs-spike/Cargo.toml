[package]
name = "module-engine-ecs-spike"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
bevy_ecs = { version = "=0.20.1", default-features = false, features = ["std", "bevy_reflect"] }
