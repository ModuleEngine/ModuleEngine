<script>
const entries=[{"id": "P01", "label": {"en": "Engine Overview", "ru": "Обзор Engine"}, "group": "windows", "status": "current_surface", "purpose": {"en": "Understand this project’s technical composition and reach its real configuration.", "ru": "Понять технический состав этого проекта и перейти к настоящим настройкам."}, "rights": {"en": "Current tool requires Engine authoring/source availability; a retained unavailable area shows a reason, not unlocked Team access.", "ru": "Нынешний инструмент требует прав Engine/исходников; сохранённая недоступная область показывает причину, не открывает доступ Team."}, "requirements": [{"en": "Separate Technical Engine, reusable Gameplay, Project and Unknown ownership.", "ru": "Разделить Technical Engine, переиспользуемый Gameplay, Project и Unknown."}, {"en": "Show project/configuration basis/rights and installed, offered, participating evidence independently.", "ru": "Независимо показать проект/основание конфигурации/права и доказательства installed, offered, participating."}, {"en": "Use only real navigation targets; inspection never executes factories or compiles.", "ru": "Использовать настоящие переходы; просмотр не запускает фабрики и компиляцию."}, {"en": "Use the focused hierarchy prototype: role-based row spacing, selected item marker, restrained boundaries and at most one contextual primary action. Readonly facts remain visually distinct from editable fields.", "ru": "Использовать уточнённый макет иерархии: интервалы по роли строки, маркер выбора, сдержанные границы и не более одного основного действия в контексте. Факты только для чтения визуально отличаются от редактируемых полей."}, {"en": "Keep composition groups, subsystem selection and details in separate visual levels. Place real render-graph navigation next to the selected renderer; preserve installed/offered/participating facts and the runtime-readiness limitation.", "ru": "Развести группы состава, выбор подсистемы и подробности по визуальным уровням. Поставить настоящий переход к render graph рядом с выбранным рендером; сохранить installed/offered/participating и ограничение сведений о готовности runtime."}], "states": {"ready": {"en": "Selected group and subsystem have persistent markers; the renderer detail has one primary Open render graph action. Show Installed, Offered and Participating as three separate facts, not a Ready badge.", "ru": "Выбранные группа и подсистема имеют постоянные маркеры; в подробностях рендера одно основное действие Open render graph. Показать Installed, Offered, Participating тремя фактами, не значком Ready."}, "empty": {"en": "No matching capabilities. Clear the search; this is not proof that the engine is empty.", "ru": "Нет совпавших возможностей. Очистить поиск; это не доказательство пустого движка."}, "busy": {"en": "Use available snapshots and identify pending evidence; reading must not launch a factory, service or compiler.", "ru": "Использовать доступные снимки и обозначить ожидание данных; чтение не запускает фабрику, сервис или компилятор."}, "draft": {"en": "NA: this view does not own an authored draft; show project dirty state only in the shell.", "ru": "NA: окно не владеет авторским черновиком; несохранённость проекта показывается в каркасе."}, "error": {"en": "Explain the failed evidence/read operation and retain the previous readable record with its provenance.", "ru": "Объяснить сбой получения/чтения данных и сохранить прежнюю читаемую запись с происхождением."}, "restricted": {"en": "Omit or disable unsupported navigation under actual rights; retaining an area never unlocks it.", "ru": "Скрыть или заблокировать неподдержанный переход по настоящим правам; сохранённая область ничего не разблокирует."}, "missing": {"en": "Evidence unavailable for a capability: show Unknown and its source/error, never an inactive checkbox.", "ru": "Данные о возможности недоступны: Unknown и источник/ошибка, не отметка неактивности."}, "compact": {"en": "At a 480-point dock area, drill into the selected subsystem with Back to composition. Keep rights/context, supported actions and evidence visible; selection and search survive the return. This is an area variant, not an entire OS window.", "ru": "В dock-области 480 точек открыть выбранную подсистему с Back to composition. Сохранить права/контекст, поддержанные действия и доказательства; выбор и поиск сохраняются при возврате. Это вариант области, не целое окно ОС."}}, "keyboard": {"en": "Keyboard focus stays inside the active context; Escape cancels only its uncommitted gesture or popup.", "ru": "Фокус остаётся в активном контексте; Escape отменяет только его незавершённый жест или popup."}, "persistence": {"en": "Preserve exact authored data, stable IDs and personal view state; use existing validated history/persistence paths.", "ru": "Сохранить точные авторские данные, стабильные ID и личный вид; использовать существующие проверенные историю/сохранение."}, "widgets": [], "compact": true}, {"id": "P02", "label": {"en": "Module Blueprint / root graph", "ru": "Module Blueprint / корневой граф"}, "group": "windows", "status": "current_surface", "purpose": {"en": "Inspect and edit the current root module process without confusing it with GPU passes or the gameplay schedule.", "ru": "Просматривать и менять корневой процесс модулей, не путая его с GPU-проходами или игровым расписанием."}, "rights": {"en": "Full with matching complete sources; existing source and candidate validation remain authoritative.", "ru": "Full с полными совпадающими исходниками; действуют проверки исходников и кандидатов."}, "requirements": [{"en": "Show the actual scope breadcrumb and document/apply status.", "ru": "Показать настоящий путь области и состояние документа/Apply."}, {"en": "Use MMB/RMB pan, pointer wheel zoom, background/node RMB actions and mixed Delete/Undo as the agreed target.", "ru": "Целевое управление: СКМ/ПКМ, колесо под курсором, действия ПКМ фона/ноды и смешанные Delete/Undo."}, {"en": "Keep one authority: node inspector, raw JSON and graph edit the same data; opening a subgraph does not imply a universal scheduler.", "ru": "Один источник данных: inspector, JSON и граф; открытие подграфа не создаёт универсальный scheduler."}, {"en": "Do not render a persistent Add/Open/Frame/Delete toolbar. Background RMB opens Add, a double LMB click opens an existing permitted subgraph, F frames the current graph and Delete removes the selection. Context menus remain discoverable equivalents of these same commands.", "ru": "Не рисовать постоянный ряд Add/Open/Frame/Delete. ПКМ фона открывает добавление, двойной щелчок ЛКМ — существующий разрешённый подграф, F кадрирует текущий граф, Delete удаляет выделение. Контекстные меню остаются обнаруживаемыми эквивалентами тех же команд."}], "states": {"ready": {"en": "The canvas starts directly below the pane header, without repeated Add/Open/Frame/Delete buttons. Context actions and gestures target the same current graph and existing validated commands.", "ru": "Холст начинается сразу под заголовком области, без повторных кнопок Add/Open/Frame/Delete. Контекстные действия и жесты относятся к тому же текущему графу и существующим проверяемым командам."}, "empty": {"en": "Show No nodes with a contextual Right-click to add hint, available scope and actual compatible palette. Do not create default nodes merely to fill the canvas.", "ru": "Показать No nodes с контекстной подсказкой Right-click to add, доступной областью и настоящей совместимой палитрой. Не создавать стандартные ноды ради заполнения холста."}, "busy": {"en": "Show the real pending operation and last-good revision; prevent conflicting edits without blocking navigation.", "ru": "Показать настоящую операцию и последнюю рабочую ревизию; блокировать конфликтующие правки, не навигацию."}, "draft": {"en": "Mark local edits separately from saved/applied data; commit only through the existing validated transaction.", "ru": "Отметить локальные правки отдельно от сохранённого/применённого; записывать через существующую проверенную транзакцию."}, "error": {"en": "Invalid wire/node candidate: show endpoints and exact contract mismatch; keep the last-good executable graph.", "ru": "Неверная связь/нода: показать концы и точное несовпадение; сохранить рабочий исполняемый граф."}, "restricted": {"en": "Show the exact Full/Team/source/Play restriction; no workspace tab grants permission.", "ru": "Показать конкретное ограничение Full/Team/исходников/Play; вкладка раскладки не выдаёт права."}, "missing": {"en": "Keep stable IDs and missing references inspectable; never silently replace or activate a dependency.", "ru": "Сохранить доступность стабильных ID и отсутствующих ссылок; не подменять и не включать зависимость молча."}, "compact": {"en": "Stack secondary sections or use explicit overflow; preserve scope, primary action, error and navigation without shrinking text.", "ru": "Сложить второстепенное вертикально или убрать в явное меню; сохранить область, основное действие, ошибку и навигацию без уменьшения текста."}}, "keyboard": {"en": "With graph-canvas focus: F frames the current graph and Delete removes the mixed selection through validation/one Undo. Double-click an expandable node outside pins/embedded controls to enter its subgraph; text, popups and modals own their input first. RMB click adds/opens actions; MMB/RMB drag pans; plain wheel zooms. Escape cancels the active gesture. Menu key/Shift+F10 opens the focused graph target’s context menu as a proposed keyboard equivalent.", "ru": "При фокусе холста графа: F кадрирует текущий граф, Delete удаляет смешанное выделение через проверку/один Undo. Двойной щелчок разворачиваемой ноды вне пинов/встроенных полей открывает подграф; текст, popup и модальные окна получают ввод первыми. Щелчок ПКМ добавляет/открывает действия; СКМ/ПКМ drag двигает вид; колесо масштабирует. Escape отменяет текущий жест. Клавиша меню/Shift+F10 открывает контекстное меню цели сфокусированного графа как предлагаемый клавиатурный эквивалент."}, "persistence": {"en": "Preserve exact authored data, stable IDs and personal view state; use existing validated history/persistence paths.", "ru": "Сохранить точные авторские данные, стабильные ID и личный вид; использовать существующие проверенные историю/сохранение."}, "widgets": [], "compact": false}, {"id": "P03", "label": {"en": "Module Library", "ru": "Библиотека модулей"}, "group": "windows", "status": "current_surface", "purpose": {"en": "Find a compatible node for a clearly identified graph destination.", "ru": "Найти совместимую ноду для явно указанного графа назначения."}, "rights": {"en": "Real graph scope, installed descriptors and Full/Team/source rules; no global bypass list.", "ru": "Настоящая область графа, установленные описания и Full/Team/исходники; без глобального списка в обход прав."}, "requirements": [{"en": "Searchable category rows replace the wall of full-width add buttons.", "ru": "Строки категорий с поиском заменяют колонку широких кнопок."}, {"en": "Name the destination graph, not only a pane number; ambiguous destinations require explicit choice.", "ru": "Называть граф назначения, не только номер панели; неоднозначность требует выбора."}, {"en": "Pin contracts live in contextual help/optional Connection types, not an unexplained permanent footer; no source export command here.", "ru": "Контракты пинов — в контексте/Connection types, не постоянном непонятном подвале; экспорт исходников здесь не нужен."}], "states": {"ready": {"en": "Selected data and actual command availability are visible.", "ru": "Видны выбранные данные и настоящая доступность команд."}, "empty": {"en": "No nodes match this search/scope. Clear search or choose an actual compatible graph.", "ru": "Нет нод для поиска/области. Очистить поиск или выбрать совместимый граф."}, "busy": {"en": "Show the real pending operation and last-good revision; prevent conflicting edits without blocking navigation.", "ru": "Показать настоящую операцию и последнюю рабочую ревизию; блокировать конфликтующие правки, не навигацию."}, "draft": {"en": "The catalogue owns no node draft; an unresolved Project File/graph draft explains why Add is disabled.", "ru": "У каталога нет черновика ноды; незавершённый Project File/граф объясняет недоступность Add."}, "error": {"en": "Show the rejected candidate and actionable error; retain authored data, draft and last-good runtime as the applicable contract requires.", "ru": "Показать отклонённый кандидат и понятную ошибку; сохранить авторские данные, черновик и рабочий runtime согласно затронутому контракту."}, "restricted": {"en": "Show the exact Full/Team/source/Play restriction; no workspace tab grants permission.", "ru": "Показать конкретное ограничение Full/Team/исходников/Play; вкладка раскладки не выдаёт права."}, "missing": {"en": "Target area was closed or changed scope: clear the stale target and offer a valid target; never add elsewhere silently.", "ru": "Цель закрыта/сменила область: сбросить устаревший адрес и предложить допустимый; не добавлять в другой граф молча."}, "compact": {"en": "Stack secondary sections or use explicit overflow; preserve scope, primary action, error and navigation without shrinking text.", "ru": "Сложить второстепенное вертикально или убрать в явное меню; сохранить область, основное действие, ошибку и навигацию без уменьшения текста."}}, "keyboard": {"en": "Keyboard focus stays inside the active context; Escape cancels only its uncommitted gesture or popup.", "ru": "Фокус остаётся в активном контексте; Escape отменяет только его незавершённый жест или popup."}, "persistence": {"en": "Preserve exact authored data, stable IDs and personal view state; use existing validated history/persistence paths.", "ru": "Сохранить точные авторские данные, стабильные ID и личный вид; использовать существующие проверенные историю/сохранение."}, "widgets": [], "compact": false}, {"id": "P04", "label": {"en": "Engine Exposure", "ru": "Разрешения Project в Engine"}, "group": "windows", "status": "current_surface", "purpose": {"en": "Define exactly which parameters and ready variants a game project may change.", "ru": "Определить, какие именно параметры и готовые варианты может менять игровой проект."}, "rights": {"en": "Full and complete matching sources only; Project cannot add architecture or widen its own exposure.", "ru": "Только Full и полные совпадающие исходники; Project не добавляет архитектуру и не расширяет собственные разрешения."}, "requirements": [{"en": "Group exposed parameters, ready variant sets/defaults and participating feature definitions.", "ru": "Сгруппировать параметры, наборы вариантов/значения по умолчанию и определения участвующих возможностей."}, {"en": "Expose only existing eligible pass parameters/implementations; removing exposure reconciles orphaned Project values.", "ru": "Выдавать только существующие подходящие параметры/реализации; снятие разрешения согласованно убирает осиротевшие значения Project."}, {"en": "PropertySchema exposure and ComponentSchema ownership remain distinct; show source pins and bounds.", "ru": "Различать разрешения PropertySchema и владельца ComponentSchema; показать исходные pins и границы."}], "states": {"ready": {"en": "Selected data and actual command availability are visible.", "ru": "Видны выбранные данные и настоящая доступность команд."}, "empty": {"en": "Nothing is exposed to Project. Offer eligible source-backed controls, not fabricated settings.", "ru": "Project ничего не разрешено. Предложить подходящие исходные элементы, не вымышленные настройки."}, "busy": {"en": "Show the real pending operation and last-good revision; prevent conflicting edits without blocking navigation.", "ru": "Показать настоящую операцию и последнюю рабочую ревизию; блокировать конфликтующие правки, не навигацию."}, "draft": {"en": "Mark local edits separately from saved/applied data; commit only through the existing validated transaction.", "ru": "Отметить локальные правки отдельно от сохранённого/применён
