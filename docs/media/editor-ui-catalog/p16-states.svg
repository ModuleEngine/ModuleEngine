<text x="28" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF5" data-max-width="592">Error / rejected</text>
<text x="28" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#E6EDF5" data-max-width="592">Explain the failed evidence/read operation and retain the previous readable</text>
<text x="28" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#E6EDF5" data-max-width="592">record with its provenance.</text>
