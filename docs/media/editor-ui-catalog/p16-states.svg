<text x="660" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF5" data-max-width="592">Draft / modified</text>
<text x="660" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#B6C4D5" data-max-width="592">Not applicable — this view does not own an authored draft; show project</text>
<text x="660" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#B6C4D5" data-max-width="592">dirty state only in the shell.</text>
<text x="660" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#B6C4D5" data-max-width="592">N/A is explicit, not an unimplemented control.</text>
