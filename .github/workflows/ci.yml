name: ModuleEngine CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-engine-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    name: Select verification routes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    outputs:
      native: ${{ steps.routes.outputs.native }}
      package: ${{ steps.routes.outputs.package }}
      light: ${{ steps.routes.outputs.light }}
      route: ${{ steps.routes.outputs.route }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: routes
        run: python scripts/ci_plan.py --base "$CI_BASE"
      - name: Reject new documentation links to local files
        run: python scripts/check_doc_links.py --base "$CI_BASE"

  workspace:
    name: workspace (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.light == 'false'
    strategy: &os_matrix
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: cargo-nextest@0.9.152
      - &vulkan
        name: Select and verify Linux software Vulkan
        if: runner.os == 'Linux'
        run: |
          icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$icd" vulkaninfo --summary
      - name: Verify the explicit DXC capability skip on Linux
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld
        run: python scripts/ci_workspace_tests.py --without-dxc
      - &dxc
        name: Restore pinned Linux DXC
        if: runner.os == 'Linux'
        run: |
          python scripts/ci_linux_dxc.py
          echo "MODULE_ENGINE_DXC=$GITHUB_WORKSPACE/.tools/ci-dxc/bin/dxc" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.tools/ci-dxc/lib" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/.tools/ci-dxc/lib" .tools/ci-dxc/bin/dxc --version
      - name: Run all workspace tests and report package counts
        run: python scripts/ci_workspace_tests.py --nextest
      - &reports
        name: Upload current-run reports even after failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: verification-${{ github.job }}-${{ matrix.os }}-${{ github.run_attempt }}
          path: outputs/verification/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: release (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.light == 'false'
    strategy: *os_matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - name: Build the default Release Editor
        env: &build_env
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld
        run: cargo build --offline --locked --release -p module-engine-editor --bins
      - name: Default Release Editor refuses verification commands
        env: *build_env
        run: cargo test --offline --locked --release -p module-engine-editor --test verification_cli
      - name: Build the Editor without game packages
        env: *build_env
        run: |
          python scripts/ci_workspace_tests.py --check-game-free-editor
          cargo build --offline --locked --release -p module-engine-editor --no-default-features
      - *reports

  clippy:
    name: clippy (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.light == 'false'
    strategy: *os_matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - name: Inspect Clippy plan
        run: python scripts/verify.py --profile clippy --plan
      - name: Strict pinned Clippy (workspace and default Release Editor)
        env: *build_env
        run: python scripts/verify.py --profile clippy --timeout 1800
      - *reports

  contracts:
    name: contracts (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.light == 'false'
    strategy: *os_matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - *vulkan
      - *dxc
      - name: Third-party license policy and notices file
        run: python scripts/third_party_licenses.py --check
      - name: Launcher and CI policy unit checks
        run: python -B -m unittest discover -s scripts -p "test_*.py" -v
      - name: Inspect contracts plan
        run: python scripts/verify.py --profile contracts --plan
      - name: Contracts
        run: python scripts/verify.py --profile contracts --timeout 1800
      - name: Standalone ECS spike contracts (Release)
        run: cargo test --release --locked --manifest-path crates/ecs-spike/Cargo.toml --target-dir target/ecs-spike
      - *reports

  player:
    name: player (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.light == 'false'
    strategy: *os_matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - name: Check and build the minimal Player
        env: *build_env
        run: |
          python scripts/ci_workspace_tests.py --check-minimal-player
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p module-engine-player --no-default-features --config profile.dev.debug=0
        shell: pwsh
      - name: Test the minimal Player separately
        env: *build_env
        run: cargo test --locked -p module-engine-player --no-default-features --config profile.test.debug=0
      - *reports

  native:
    name: native (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.native == 'true'
    strategy: *os_matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - *vulkan
      - *dxc
      - name: Windows native toolchain contracts (no GPU acceptance)
        if: runner.os == 'Windows'
        run: python scripts/verify.py --profile native-tools --timeout 1800
      - name: Linux native offscreen contracts (Mesa software device)
        if: runner.os == 'Linux'
        run: python scripts/verify.py --profile native --require-capabilities --timeout 1800
      - name: Recover a Vulkan window after an abandoned acquire (Mesa/X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --no-install-recommends -y xvfb xauth vulkan-validationlayers
          xvfb-run -a cargo test --locked -p module-engine-native-ui --lib -- gpu::tests::failed_recording_retires_the_acquired_slot_before_retry --ignored --exact --nocapture
      - *reports

  package:
    name: package (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.package == 'true'
    strategy: *os_matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - *vulkan
      - *dxc
      - name: Native package fixture contracts
        run: python scripts/verify.py --profile package --timeout 1800
      - *reports

  documentation:
    name: Documentation and site checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check the bilingual roadmap and its Node model
        run: |
          node --version
          python -B -m unittest discover -s site -p "test_roadmap*.py" -v
          python -B site/roadmap_map.py --check
          python -B site/roadmap_map.py --out _site/index.html
          test -s _site/index.html
          test -s _site/world/index.html

  required:
    name: CI required
    if: always()
    needs: [plan, workspace, release, clippy, contracts, player, native, package, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Reject failed, cancelled or skipped prerequisite jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci_plan.py --gate
