name: Claude PR review

# Reviews a PR when it is opened / reopened / ready for review and again after every new push.
# Claude only READS the PR and writes the review text to claude-review.md (no permission to post anything).
# A separate deterministic step then publishes it as ONE comment authored by github-actions[bot],
# found by an exact marker on its first line and updated by ID (created if absent).
# A green job means the review of the current commit was published. If a review was expected but
# claude-review.md is missing, empty or names another commit, the job FAILS.
# The only exception is a PR that itself changes this workflow: the action refuses to run a workflow
# that differs from the one on the base branch, so the step reports an explicit "review skipped".
# Requires the repository secret CLAUDE_CODE_OAUTH_TOKEN (generate with `claude setup-token`).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts (ready_for_review triggers the review later) and PRs from forks (no access to secrets).
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # Pinned to the commit that the moving tag v1 pointed to on 2026-11-25. Update deliberately.
      - id: review
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Edit(./claude-review.md),Read,Grep,Glob"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEWED COMMIT SHA: ${{ github.event.pull_request.head.sha }}

            Review this pull request. Do not push commits and do not modify any repository files.
            The checkout is a detached HEAD, so ALWAYS pass the PR number and repo explicitly:
            `gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }}`,
            `gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }}`,
            `gh pr checks ${{ github.event.pull_request.number }} --repo ${{ github.repository }}`.

            Do NOT post comments yourself. Write the final review, in Russian, to the file `claude-review.md`
            in the workspace root (create it with the Write tool; this is the only file you may write). A later
            workflow step publishes it. Be concise. The file must start with the line
            "Ревью коммита <first 7 chars of REVIEWED COMMIT SHA>" and contain:
            1. Verdict: one line (ok / ok with remarks / needs changes).
            2. CI status (`gh pr checks`); say if checks are still running.
            3. What was checked.
            4. Minor remarks, all together; real bugs go first.

            Project conventions to verify:
            - Every real Rust `#[ignore]` test needs a matching step in scripts/verification.json
              (`ignored: true`, `filter` ending in the test function name) that is either part of a profile
              or marked `excluded` with a reason. scripts/test_verify.py discovers the real `#[ignore]` tests
              automatically and compares them with the registry, so do NOT ask for manual edits of
              scripts/verify.py or for a hand-maintained counter. Only if the PR adds or moves such a step,
              check that the explicit expectations in test_verify.py (set of excluded ids, per-profile step
              counts) were updated to match.
            - CI does not fully run all editor tests. List explicitly which changes need local Windows
              verification (GPU/editor/bench behaviour that CI cannot cover).
            - Flag changed docs without the matching docs/ru translation if the English doc changed.
            Report only what you actually checked; do not claim tests passed that were not run.

      - name: Publish the review comment
        if: always() && steps.review.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          file=claude-review.md
          workflow=.github/workflows/claude-pr-review.yml
          marker='<!-- claude-pr-review -->'
          short="${HEAD_SHA:0:7}"

          fail() {
            echo "::error title=Claude review not published::$1"
            {
              echo "### Claude review: FAILED"
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          if [ ! -s "$file" ] || [ "$(head -n1 "$file" | tr -d '\r')" != "Ревью коммита $short" ]; then
            # Expected exception: the action refuses to run when this workflow differs from the base branch's copy
            # (for example in the PR that adds or changes this very file). Then the review is explicitly skipped.
            base_copy="$(mktemp)"
            if ! gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/$workflow?ref=$BASE_SHA" > "$base_copy" 2> /dev/null \
                || ! cmp -s "$base_copy" "$workflow"; then
              echo "::notice title=Claude review skipped::This PR changes $workflow; the action does not run a workflow that differs from the base branch. No review was produced."
              {
                echo "### Claude review: SKIPPED"
                echo "This PR adds or changes \`$workflow\`, and the action does not run a workflow that differs from the base branch. No review was produced for \`$short\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            fail "Expected a fresh non-empty $file whose first line is 'Ревью коммита $short', but it is missing, empty or names another commit."
          fi

          # The marker is always added here; any marker line in the text is dropped, and the size is capped.
          text="$(grep -vxF "$marker" "$file" | head -c 60000 || true)"
          body="$(printf '%s\n%s\n' "$marker" "$text")"
          # Only a comment authored by github-actions[bot] whose FIRST line is exactly the marker is ours.
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select((.body | split("\n")[0] | rtrimstr("\r")) == "<!-- claude-pr-review -->") | .id' \
            | sed -n '1p')"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
            echo "Updated comment $id"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
            echo "Created comment"
          fi
          echo "### Claude review: published for \`$short\`" >> "$GITHUB_STEP_SUMMARY"
