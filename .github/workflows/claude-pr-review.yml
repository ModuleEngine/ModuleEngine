name: Claude PR review

# Reviews a PR when it is opened / reopened / ready for review and again after every new push.
#
# Design (the review must be provably file-by-file, and Claude can only READ):
# 1. A prepare step writes one diff file per changed file into .review-diffs/ plus a manifest. Every diff file
#    contains random chunk tokens (a few per file); only the SHA-256 hashes of the tokens are in the manifest.
# 2. Claude gets read-only tools (Read/Grep/Glob, gh pr view/checks) and may write only claude-review.md.
#    It must quote the tokens of every file it read, so it cannot report a file it never opened to the end.
# 3. A publish step validates the report: first line names the commit, required sections, exactly one counter,
#    one line for EVERY changed file (matched against the manifest), correct tokens for files marked "read",
#    a note for every file, and no plain verdict "ok" if a file was skipped. Only then it publishes ONE comment
#    authored by github-actions[bot], found by an exact marker on its first line and updated by ID.
# A green job therefore means a complete review of the current commit was published. A missing, empty or
# invalid report fails the job. The only exception is a PR that itself adds or changes this workflow: the
# action refuses to run a workflow that differs from the one on the base branch, so the step reports an
# explicit "review skipped" (allowed only when the base copy is confirmed absent (HTTP 404) or different).
# Known limit: the tokens prove that every chunk of every diff was seen, not that it was understood.
# Requires the repository secret CLAUDE_CODE_OAUTH_TOKEN (generate with `claude setup-token`).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts (ready_for_review triggers the review later) and PRs from forks (no access to secrets).
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # Depth 2 keeps both parents of the PR merge commit, so HEAD^1 (base) .. HEAD (merged PR) is the PR diff.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Prepare per-file diffs for the reviewer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, secrets, subprocess
          CHUNK = 400  # diff lines per chunk token
          out = pathlib.Path(".review-diffs")
          out.mkdir()
          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, check=True).stdout
          raw = git("diff", "-z", "--name-only", "HEAD^1", "HEAD").decode("utf-8", "surrogateescape")
          paths = [p for p in raw.split("\0") if p]
          manifest = []
          for number, path in enumerate(paths, 1):
              fid = "%04d" % number
              diff = git("diff", "HEAD^1", "HEAD", "--", path).decode("utf-8", "replace")
              diff_lines = diff.split("\n")
              if diff_lines and diff_lines[-1] == "":
                  diff_lines.pop()
              chunks = max(1, -(-len(diff_lines) // CHUNK))
              tokens, text = [], []
              for k in range(chunks):
                  text.extend(diff_lines[k * CHUNK:(k + 1) * CHUNK])
                  token = secrets.token_hex(5)
                  tokens.append(token)
                  text.append("#REVIEW-CHUNK %s.%d/%d token=%s" % (fid, k + 1, chunks, token))
              name = fid + ".diff"
              (out / name).write_text("\n".join(text) + "\n", encoding="utf-8")
              manifest.append({
                  "id": fid,
                  "path": path.encode("utf-8", "surrogateescape").decode("utf-8", "replace"),
                  "diff_file": ".review-diffs/" + name,
                  "diff_lines": len(diff_lines),
                  "file_lines_with_markers": len(text),
                  "chunk_tokens_expected": chunks,
                  "token_sha256": [hashlib.sha256(t.encode()).hexdigest() for t in tokens],
              })
          (out / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=1), encoding="utf-8")
          print("Prepared %d per-file diffs" % len(manifest))
          PY

      # Pinned to the commit that the moving tag v1 pointed to on 2026-11-25. Update deliberately.
      - id: review
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 250
            --allowedTools "Bash(gh pr view:*),Bash(gh pr checks:*),Edit(./claude-review.md),Read,Grep,Glob"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEWED COMMIT SHA: ${{ github.event.pull_request.head.sha }}

            Review this pull request. Do not push commits and do not modify any repository files.
            The checkout is a detached HEAD, so ALWAYS pass the PR number and repo explicitly:
            `gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }}`,
            `gh pr checks ${{ github.event.pull_request.number }} --repo ${{ github.repository }}`.

            HOW TO READ THE CHANGES (mandatory, no shortcuts):
            1. Read `.review-diffs/manifest.json`. It has one entry per changed file: `id`, `path`, `diff_file`,
               `chunk_tokens_expected` and `token_sha256`. M is the number of entries.
            2. For EVERY entry read the whole `diff_file` with the Read tool. If it is longer than the Read limit,
               read it in several parts (offset and limit) until the end. Each diff file contains marker lines
               `#REVIEW-CHUNK <id>.<k>/<n> token=<token>`. Collect all `n` tokens of the file, in order.
               Do not sample, do not use Grep to skim, do not judge a file by its name, size or status of CI.
               Never skip a file because the PR is large or because the file looks generated.
            3. Only if a file really cannot be read (tool limits, binary), mark it `skipped` with the reason.
            4. You may not give the verdict `ok` if any file is `skipped`.

            Do NOT post comments yourself. Write the final review, in Russian, to the file `claude-review.md`
            in the workspace root (create it with the Write tool; this is the only file you may write). A later
            workflow step validates and publishes it, so the format is strict. The file must be exactly:

            Ревью коммита <first 7 chars of REVIEWED COMMIT SHA>
            Вердикт: <exactly one of: ok | ok with remarks | needs changes>, optionally followed by a short reason
            CI: <status from `gh pr checks`; say if checks are still running>
            Что проверено: <specific description of what you checked and how, at least a few sentences; it must
            contain exactly one counter line, and no other "N из M" anywhere in this section>
            Прочитано файлов: <N> из <M>
            Файлы:
            - <id> | read | <token1>.<token2>.<...all tokens of that file, in order, joined by dots> | <note>
            - <id> | skipped | - | <reason>
            Замечания: <minor remarks all together, real bugs first; write "нет" if none; if files were skipped,
            say so here again>

            Rules for the section `Файлы:`: put the heading alone on its line, then exactly one line for EVERY id in
            the manifest, each id exactly once, in the manifest order. `<note>` is what this file's change does and
            whether you found a problem in it (at least 12 characters, specific to that file). `N` is the number of
            `read` lines and must equal the counter; M must equal the number of manifest entries.
            Each of the five headings (`Вердикт:`, `CI:`, `Что проверено:`, `Файлы:`, `Замечания:`) must start a line,
            appear exactly once, in this order. There must be no text between the first line and `Вердикт:`.

            Project conventions to verify:
            - Every real Rust `#[ignore]` test needs a matching step in scripts/verification.json
              (`ignored: true`, `filter` ending in the test function name) that is either part of a profile
              or marked `excluded` with a reason. scripts/test_verify.py discovers the real `#[ignore]` tests
              automatically and compares them with the registry, so do NOT ask for manual edits of
              scripts/verify.py or for a hand-maintained counter. Only if the PR adds or moves such a step,
              check that the explicit expectations in test_verify.py (set of excluded ids, per-profile step
              counts) were updated to match.
            - CI does not fully run all editor tests. List explicitly which changes need local Windows
              verification (GPU/editor/bench behaviour that CI cannot cover).
            - Flag changed docs without the matching docs/ru translation if the English doc changed.
            Report only what you actually checked; do not claim tests passed that were not run.

      - name: Publish the review comment
        if: always() && steps.review.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          file=claude-review.md
          rendered=claude-review.rendered.md
          manifest=.review-diffs/manifest.json
          workflow=.github/workflows/claude-pr-review.yml
          marker='<!-- claude-pr-review -->'
          short="${HEAD_SHA:0:7}"

          fail() {
            echo "::error title=Claude review not published::$1"
            {
              echo "### Claude review: FAILED"
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          if [ ! -s "$file" ]; then
            # No review was written. This is acceptable only when the action refused to run because this PR
            # adds or changes this workflow. Confirm that with an explicit HTTP status; anything unexpected fails.
            base_copy="$(mktemp)"
            code="$(curl -sS --max-time 30 --retry 2 -o "$base_copy" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw' \
              "https://api.github.com/repos/$REPO/contents/$workflow?ref=$BASE_SHA")" \
              || fail "Expected a review in $file, and the check whether this PR changes the workflow could not be completed (request to GitHub failed)."
            reason=""
            if [ "$code" = "404" ]; then
              reason="$workflow does not exist on the base branch yet"
            elif [ "$code" = "200" ]; then
              cmp_status=0
              cmp -s "$base_copy" "$workflow" || cmp_status=$?
              case "$cmp_status" in
                0) fail "Expected a review in $file, but it is missing or empty, and this PR does not change the workflow." ;;
                1) reason="$workflow differs from the base branch" ;;
                *) fail "Could not compare $workflow with the base copy (cmp exit $cmp_status)." ;;
              esac
            else
              fail "Expected a review in $file, and the check whether this PR changes the workflow failed with HTTP $code."
            fi
            echo "::notice title=Claude review skipped::$reason; the action does not run such a workflow. No review was produced."
            {
              echo "### Claude review: SKIPPED"
              echo "$reason, and the action does not run a workflow that differs from the base branch. No review was produced for \`$short\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          [ -s "$manifest" ] || fail "The per-file diff manifest $manifest is missing, so the review coverage cannot be verified."

          # A review exists: validate structure, per-file coverage and tokens, and render the final comment text.
          if ! problem="$(python3 - "$file" "$short" "$manifest" "$rendered" 2>&1 <<'PY'
          import hashlib, json, re, sys
          review_path, short, manifest_path, out_path = sys.argv[1:5]
          manifest = json.load(open(manifest_path, encoding="utf-8"))
          by_id = {m["id"]: m for m in manifest}
          lines = open(review_path, encoding="utf-8").read().replace("\r", "").split("\n")
          if lines[0].strip() != "Ревью коммита " + short:
              sys.exit("the first line must be 'Ревью коммита " + short + "'")
          heads = ["Вердикт:", "CI:", "Что проверено:", "Файлы:", "Замечания:"]
          found = {}
          for i, line in enumerate(lines[1:], 1):
              for h in heads:
                  if line.startswith(h):
                      if h in found:
                          sys.exit("section '" + h + "' appears more than once")
                      found[h] = i
          missing = [h for h in heads if h not in found]
          if missing:
              sys.exit("missing sections: " + ", ".join(missing))
          pos = [found[h] for h in heads]
          if pos != sorted(pos):
              sys.exit("sections are out of order")
          if any(l.strip() for l in lines[1:pos[0]]):
              sys.exit("there must be no text between the first line and 'Вердикт:'")
          sections = {}
          for n, h in enumerate(heads):
              end = pos[n + 1] if n + 1 < len(pos) else len(lines)
              sections[h] = [lines[pos[n]][len(h):]] + lines[pos[n] + 1:end]
              if not "\n".join(sections[h]).strip():
                  sys.exit("section '" + h + "' is empty")
          verdict = "\n".join(sections["Вердикт:"]).strip()
          if not re.match(r"(ok with remarks|ok|needs changes)\b", verdict):
              sys.exit("the verdict must start with: ok | ok with remarks | needs changes")
          # 'Что проверено:' = real prose plus exactly one counter line.
          checked = [l for l in sections["Что проверено:"] if l.strip()]
          counters = [l for l in checked if l.startswith("Прочитано файлов")]
          if len(counters) != 1:
              sys.exit("'Что проверено:' must contain exactly one line 'Прочитано файлов: N из M' (found " + str(len(counters)) + ")")
          counter = re.fullmatch(r"Прочитано файлов:\s*(\d+)\s+из\s+(\d+)\s*", counters[0])
          if not counter:
              sys.exit("the counter line must look like 'Прочитано файлов: N из M'")
          claimed_read, claimed_total = int(counter.group(1)), int(counter.group(2))
          prose = [l for l in checked if not l.startswith("Прочитано файлов")]
          extra = [l for l in prose if re.search(r"\d+\s+из\s+\d+", l)]
          if extra:
              sys.exit("only one counter is allowed in 'Что проверено:', found another: " + extra[0].strip()[:80])
          if sum(len(l.strip()) for l in prose) < 60:
              sys.exit("'Что проверено:' needs a specific description of at least 60 characters besides the counter line")
          # 'Файлы:' = exactly one line per manifest entry.
          entries, read_ids, skipped_ids, rendered = {}, [], [], {}
          files_body = sections["Файлы:"]
          if not manifest:
              if files_body[0].strip().rstrip(". ").lower() != "нет" or any(l.strip() for l in files_body[1:]):
                  sys.exit("the PR changes no files, so 'Файлы:' must be 'Файлы: нет'")
          else:
              if files_body[0].strip():
                  sys.exit("put the heading 'Файлы:' alone on its line and every file on its own line below it")
              pattern = re.compile(r"- (\d{4}) \| (read|skipped) \| (\S+) \| (.+)")
              for line in files_body[1:]:
                  if not line.strip():
                      continue
                  match = pattern.fullmatch(line.rstrip())
                  if not match:
                      sys.exit("invalid line in 'Файлы:' (expected '- <id> | read | <tokens> | <note>'): " + line.strip()[:100])
                  fid, status, tokens, note = match.groups()
                  note = note.strip()
                  if fid in entries:
                      sys.exit("file " + fid + " appears more than once in 'Файлы:'")
                  if fid not in by_id:
                      sys.exit("unknown file id " + fid + " in 'Файлы:'")
                  entry = by_id[fid]
                  display = entry["path"].replace("`", "'")
                  if status == "read":
                      expected, got = entry["token_sha256"], tokens.split(".")
                      if len(got) != len(expected) or any(hashlib.sha256(t.encode()).hexdigest() != e for t, e in zip(got, expected)):
                          sys.exit("file " + fid + " (" + entry["path"] + "): the chunk tokens are wrong or incomplete; read the whole diff file to its last '#REVIEW-CHUNK' line")
                      if len(note) < 12:
                          sys.exit("file " + fid + " (" + entry["path"] + "): the note is too short (at least 12 characters about this file)")
                      read_ids.append(fid)
                      rendered[line] = "- `" + display + "` — " + note
                  else:
                      if tokens != "-":
                          sys.exit("file " + fid + ": a skipped file must have '-' instead of tokens")
                      if len(note) < 5:
                          sys.exit("file " + fid + " (" + entry["path"] + "): give the reason why it was skipped")
                      skipped_ids.append(fid)
                      rendered[line] = "- `" + display + "` — **НЕ ПРОЧИТАН**: " + note
                  entries[fid] = status
              absent = [i for i in by_id if i not in entries]
              if absent:
                  sys.exit(str(len(absent)) + " changed files have no line in 'Файлы:', first ones: " + ", ".join(absent[:10]))
          if claimed_total != len(manifest):
              sys.exit("the counter says the PR changes " + str(claimed_total) + " files, but it changes " + str(len(manifest)))
          if claimed_read != len(read_ids):
              sys.exit("the counter says " + str(claimed_read) + " files were read, but 'Файлы:' marks " + str(len(read_ids)) + " as read")
          if skipped_ids and re.match(r"ok\b(?! with remarks)", verdict):
              sys.exit("a review that skipped files cannot have the plain verdict 'ok'")
          out = [rendered.get(l, l) for l in lines]
          open(out_path, "w", encoding="utf-8").write("\n".join(out) + "\n")
          PY
          )"; then
            fail "The review file is invalid: $problem"
          fi

          # The marker is always added here; any marker line in the text is dropped, and the size is capped.
          text="$(grep -vxF "$marker" "$rendered" | head -c 60000 || true)"
          body="$(printf '%s\n%s\n' "$marker" "$text")"
          # Only a comment authored by github-actions[bot] whose FIRST line is exactly the marker is ours.
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select((.body | split("\n")[0] | rtrimstr("\r")) == "<!-- claude-pr-review -->") | .id' \
            | sed -n '1p')"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
            echo "Updated comment $id"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
            echo "Created comment"
          fi
          echo "### Claude review: published for \`$short\`" >> "$GITHUB_STEP_SUMMARY"
