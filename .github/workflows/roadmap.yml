name: Roadmap map

# Rebuilds the visual roadmap from task statuses in docs/product-roadmap.md.
# Pull requests only validate; pushes to main publish to GitHub Pages.
# See docs/roadmap-map.md.

on:
  push:
    branches: [main]
    paths:
      - docs/product-roadmap.md
      - docs/ru/product-roadmap.md
      - scripts/roadmap_map.py
      - scripts/roadmap_map.html
      - scripts/roadmap_world.html
      - .github/workflows/roadmap.yml
  pull_request:
    paths:
      - docs/product-roadmap.md
      - docs/ru/product-roadmap.md
      - scripts/roadmap_map.py
      - scripts/roadmap_map.html
      - scripts/roadmap_world.html
      - .github/workflows/roadmap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build roadmap page
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Roadmap page tests
        run: python -B -m unittest discover -s scripts -p test_roadmap_map.py -v
      - name: Check statuses and build the page
        run: python -B scripts/roadmap_map.py --out _site/index.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
